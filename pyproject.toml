[project]
name = "finmodel-ai"
version = "0.1.0"
description = "AI-powered equity research & valuation platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "E501",   # line length is a soft guide; some data/schema lines run long
    "C408",   # dict() calls are sometimes used intentionally to copy
    "B008",   # calls in argument defaults are used deliberately and safely
    "SIM108", # an explicit if/else is sometimes clearer than a ternary
    "UP042",  # `(str, Enum)` is intentional for pydantic-friendly string enums
    "B905",   # zip() over equal-length sequences; strict= not needed here
    "B007",   # loop variables intentionally read after the loop (e.g. bisection)
]
